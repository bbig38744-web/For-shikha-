<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Shikha 🌻</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle at center, #102014, #020503 75%);
    color: white;
    font-family: Georgia, serif;
    overflow: hidden;
    min-height: 100vh;
}

/* BACKGROUND */

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* MAIN SCREEN */

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 15px;
}

.heading {
    font-size: 11px;
    letter-spacing: 5px;
    color: #a4c39e;
    animation: fadeIn 2s both;
}

h1 {
    font-size: clamp(40px, 9vw, 65px);
    font-weight: normal;
    margin-top: 18px;
    animation: fadeIn 2s 0.5s both;
}

h1 span {
    color: #ffd84b;
    font-style: italic;
    text-shadow: 0 0 25px #ffc92866;
}

.subtitle {
    font-size: 13px;
    color: #b4c2ad;
    margin-top: 12px;
    letter-spacing: 2px;
    animation: fadeIn 2s 1s both;
}

/* FLOWER */

.flower-area {
    width: min(95vw, 450px);
    height: min(53vh, 470px);
    min-height: 280px;
    margin-top: 15px;
    animation: flowerFloat 5s ease-in-out infinite;
}

svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* STEM */

.stem {
    fill: none;
    stroke: #35c66a;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: grow 3s 1s forwards;
    filter: drop-shadow(0 0 10px #24e66d);
}

/* LEAVES */

.leaf {
    fill: #087a36;
    stroke: #49df78;
    stroke-width: 2;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    animation: leafGrow 1.5s 3s forwards;
}

.leaf.right {
    animation-delay: 3.5s;
}

/* PETALS */

.petal {
    fill: url(#yellow);
    stroke: #ffe77c;
    stroke-width: 1.5;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: bloom 1.3s ease-out forwards;
    filter: drop-shadow(0 0 8px #ffc928);
}

/* FLOWER CENTER */

.center {
    fill: url(#brown);
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    animation: centerPop 1.3s 6s forwards;
    filter: drop-shadow(0 0 15px #a96b1b);
}

.seed {
    fill: #42230e;
    opacity: 0;
    animation: fadeIn 1s 6.5s forwards;
}

/* BUTTON */

button {
    background: linear-gradient(135deg, #302409, #151004);
    color: #ffe69a;
    border: 1px solid #d4a83e;
    padding: 15px 27px;
    border-radius: 40px;
    margin-top: 15px;
    cursor: pointer;
    font-family: Georgia, serif;
    font-size: 11px;
    letter-spacing: 2px;
    transition: .4s;
    animation: fadeIn 2s 7s both;
    box-shadow: 0 0 15px #e6bd5233;
}

button:hover {
    background: #5b430b;
    box-shadow: 0 0 35px #ffce39;
    transform: scale(1.06);
}

/* MESSAGE SCREEN */

.message {
    position: fixed;
    inset: 0;
    background: #020503f5;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;

    opacity: 0;
    visibility: hidden;
    transition: 1s;
}

.message.show {
    opacity: 1;
    visibility: visible;
}

.message-content {
    max-width: 430px;
    width: 100%;
    border: 1px solid #b99a43;
    padding: 35px 25px;
    background: linear-gradient(145deg, #172016, #090d08);
    box-shadow: 0 0 60px #d8a92b33;
    transform: translateY(30px) scale(.9);
    transition: 1s;
}

.message.show .message-content {
    transform: translateY(0) scale(1);
}

.message h2 {
    font-size: 40px;
    color: #ffd84b;
    margin-bottom: 25px;
}

.message p {
    font-size: 17px;
    line-height: 1.9;
    color: #eee6d1;
    min-height: 150px;
}

.signature {
    margin-top: 25px;
    color: #e6bd52;
    letter-spacing: 4px;
    font-size: 13px;
}

.close-btn {
    animation: none;
}

/* FLOATING HEARTS */

.heart {
    position: fixed;
    bottom: -30px;
    z-index: 1;
    pointer-events: none;
    color: #ffca56;
    opacity: 0;
    animation: heartRise linear forwards;
}

/* ANIMATIONS */

@keyframes grow {
    to {
        stroke-dashoffset: 0;
    }
}

@keyframes leafGrow {
    to {
        transform: scale(1);
    }
}

@keyframes bloom {
    0% {
        opacity: 0;
        transform: scale(0);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes centerPop {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes flowerFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

@keyframes heartRise {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
    }
}

@media(max-height:650px) {
    .flower-area {
        height: 40vh;
        min-height: 220px;
    }

    h1 {
        font-size: 38px;
    }
}

</style>
</head>

<body>

<canvas id="stars"></canvas>
<audio id="bgMusic" autoplay loop>
    <source src="piano.mp3" type="audio/mpeg">
</audio>
<div class="container">

    <div class="heading">
        A LITTLE GIFT MADE WITH LOVE
    </div>

    <h1>For <span>Shikha</span> ❤️</h1>

    <div class="subtitle">
        My favourite sunshine in this universe.
    </div>

    <div class="flower-area">

        <svg viewBox="0 0 420 470">

            <defs>

                <radialGradient id="yellow">
                    <stop offset="0%" stop-color="#fff59b"/>
                    <stop offset="60%" stop-color="#ffd43b"/>
                    <stop offset="100%" stop-color="#d88c0d"/>
                </radialGradient>

                <radialGradient id="brown">
                    <stop offset="0%" stop-color="#996025"/>
                    <stop offset="100%" stop-color="#301707"/>
                </radialGradient>

            </defs>

            <!-- STEM -->

            <path class="stem"
                d="M210 230 C205 300 225 360 210 440"/>

            <!-- LEAVES -->

            <path class="leaf"
                d="M210 330
                C150 275 100 300 120 335
                C145 365 180 350 210 330Z"/>

            <path class="leaf right"
                d="M215 370
                C270 315 320 335 300 365
                C275 395 240 390 215 370Z"/>

            <!-- PETALS -->

            <g id="petals"></g>

            <!-- CENTER -->

            <circle class="center"
                cx="210" cy="205" r="65"/>

            <!-- SEEDS -->

            <g id="seeds"></g>

        </svg>

    </div>

    <button onclick="openMessage()">
        OPEN YOUR LITTLE SURPRISE ❤️
    </button>

</div>

<!-- MESSAGE -->

<div class="message" id="message">

    <div class="message-content">

        <h2>Dear Shikha ❤️</h2>

        <p id="typedText"></p>

        <div class="signature">
            FOREVER YOURS — RAMAN
        </div>

        <button class="close-btn" onclick="closeMessage()">
            BACK TO MY SUNFLOWER 🌻
        </button>

    </div>

</div>

<script>

/* SUNFLOWER PETALS */

const petals = document.getElementById("petals");

for (let i = 0; i < 24; i++) {

    const angle = i * 15;

    const group = document.createElementNS(
        "http://www.w3.org/2000/svg", "g"
    );

    group.setAttribute(
        "transform",
        `translate(210 205) rotate(${angle})`
    );

    const path = document.createElementNS(
        "http://www.w3.org/2000/svg", "path"
    );

    path.setAttribute(
        "d",
        "M0 0 C-25 -35 -22 -95 0 -120 C22 -95 25 -35 0 0Z"
    );

    path.setAttribute("class", "petal");

    path.style.animationDelay =
        (4.2 + i * .07) + "s";

    group.appendChild(path);
    petals.appendChild(group);

}

/* SUNFLOWER SEEDS */

const seeds = document.getElementById("seeds");

for (let i = 0; i < 100; i++) {

    const angle = i * 2.39996;

    const radius = 8 + Math.sqrt(i) * 5.5;

    const x = 210 + Math.cos(angle) * radius;
    const y = 205 + Math.sin(angle) * radius;

    const dot = document.createElementNS(
        "http://www.w3.org/2000/svg", "ellipse"
    );

    dot.setAttribute("cx", x);
    dot.setAttribute("cy", y);
    dot.setAttribute("rx", 2);
    dot.setAttribute("ry", 3);
    dot.setAttribute("class", "seed");

    dot.style.animationDelay =
        (6.3 + i * .005) + "s";

    seeds.appendChild(dot);

}

/* STARRY SKY */

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

function resize() {

    const dpr = Math.min(
        window.devicePixelRatio || 1, 2
    );

    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = [];

    for (let i = 0; i < 170; i++) {

        stars.push({

            x: Math.random() * innerWidth,
            y: Math.random() * innerHeight,
            size: Math.random() * 1.7,
            opacity: Math.random(),
            phase: Math.random() * 6

        });

    }

}

function animateStars(time) {

    ctx.clearRect(0, 0, innerWidth, innerHeight);

    stars.forEach(star => {

        let opacity =
            star.opacity * .5 +
            Math.sin(time * .001 + star.phase) * .25;

        ctx.fillStyle =
            `rgba(230,240,220,${Math.max(.1, opacity)})`;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });

    requestAnimationFrame(animateStars);

}

resize();

window.addEventListener("resize", resize);

requestAnimationFrame(animateStars);

/* FLOATING HEARTS */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML =
        Math.random() > .5 ? "♥" : "♡";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (12 + Math.random() * 20) + "px";

    heart.style.animationDuration =
        (7 + Math.random() * 6) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 13000);

}

setInterval(createHeart, 900);

/* MESSAGE TYPING EFFECT */

const messageText =
`Like a sunflower follows the sunlight,
you bring brightness into my world.

I don't need a thousand flowers.
I just need your smile to make
my ordinary days beautiful.

No matter how many stars shine
in the sky, you will always be
my favourite little sunshine. 🌻❤️

Always keep smiling, Shikha.`;

let typingTimer;

function openMessage() {

    document.getElementById("message")
        .classList.add("show");

    const textElement =
        document.getElementById("typedText");

    textElement.innerHTML = "";

    clearInterval(typingTimer);

    let index = 0;

    typingTimer = setInterval(() => {

        if (index < messageText.length) {

            textElement.innerHTML +=
                messageText[index] === "\n"
                ? "<br>"
                : messageText[index];

            index++;

        } else {

            clearInterval(typingTimer);

        }

    }, 45);

}

function closeMessage() {

    document.getElementById("message")
        .classList.remove("show");

    clearInterval(typingTimer);

}

</script>

</body>
</html>
